<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customstuff Recap</title>
<meta name="theme-color" content="#f9a8c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="IMG_20261119_141722_069.jpg">
<style>
:root{--bg:#fff7fa;--card:rgba(255,255,255,.9);--solid:#fff;--ink:#2a1f25;--mut:#8a7580;--pri:#e0508a;--soft:#ffd6e7;--line:#f0dbe4;--ok:#2e9d6a;--warn:#d9822b;--bad:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#1c1519;--card:#2a2026;--solid:#2a2026;--ink:#f6e9ef;--mut:#b49aa6;--soft:#4a2a3a;--line:#3d2d36}}
*{box-sizing:border-box}html,body{margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg) url(IMG_20261119_142508_228.jpg) center top/cover no-repeat}
@media(prefers-color-scheme:dark){body::before{background:var(--bg)}}
body{font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
#main{padding:14px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:16px 0 8px}h3{margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.met b{display:block;font-size:17px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.dng{background:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.tap{cursor:pointer}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--soft)}
.chip.lunas,.chip.selesai{background:#cdeedd;color:#14573a}.chip.sebagian,.chip.berjalan{background:#ffe5c2;color:#7a4510}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:inherit;font-size:12px}
nav button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--solid);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}label.ck input{width:auto;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:20;display:none;max-width:90%}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
 <script>window.onerror=function(m,s,l,c){document.body.insertAdjacentHTML('afterbegin','<pre style="background:#fff;color:#c00;padding:10px;white-space:pre-wrap;position:relative;z-index:99">ERROR: '+m+' (baris '+l+':'+c+')</pre>')}</script>
<script>
const CFG='cs_cfg',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(Number(n||0))).toLocaleString('id-ID');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const sum=(a,k)=>a.reduce((x,y)=>x+Number(y[k]||0),0);
let sb=null,session=null,F=[],S={page:'home',folder:null,po:null,tab:'ringkasan',order:null,onlyUn:false,from:'',to:''};
const A={},PAGES={};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
async function q(p){const{data,error}=await p;if(error){toast(error.message);throw error}return data}
const ins=(t,o)=>q(sb.from(t).insert(o).select().single());
const upd=(t,id,o)=>q(sb.from(t).update(o).eq('id',id));
const del=(t,id)=>q(sb.from(t).delete().eq('id',id));
const log=(a,e,id,s)=>sb.from('activity_log').insert({action:a,entity:e,entity_id:id,summary:s}).then(()=>{},()=>{});
const fpath=id=>{const o=[];let c=F.find(f=>f.id===id);while(c){o.unshift(c.name);c=F.find(f=>f.id===c.parent_id)}return o.join(' / ')};
const fopts=()=>[['','(Tanpa folder)'],...F.map(f=>[f.id,fpath(f.id)]).sort((a,b)=>a[1].localeCompare(b[1]))];
const desc=id=>{const r=[id];F.filter(f=>f.parent_id===id).forEach(c=>r.push(...desc(c.id)));return r};
const loadF=async()=>{F=await q(sb.from('folders').select('*').order('name'))};
const chip=s=>`<span class="chip ${s}">${s}</span>`;

/* ---------- form sheet ---------- */
function fh(f){const v=f.v??'',r=f.req?' required':'';
 if(f.t==='select')return`<label>${f.l}<select name="${f.k}"${r}>${f.o.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(v)?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
 if(f.t==='check')return`<label class="ck"><input type="checkbox" name="${f.k}"${v?' checked':''}> ${f.l}</label>`;
 if(f.t==='area')return`<label>${f.l}<textarea name="${f.k}" rows="2">${esc(v)}</textarea></label>`;
 const ty=f.t||'text';return`<label>${f.l}<input name="${f.k}" type="${ty}"${ty==='number'?' step="any" inputmode="decimal"':''} value="${esc(v)}"${r}></label>`}
function sheet(title,fields,onSave,onDel,saveLabel){
 const el=document.createElement('div');el.className='ov';
 el.innerHTML=`<form class="sh"><h3>${esc(title)}</h3>${fields.map(fh).join('')}<div class="row"><button class="btn">${saveLabel||'Simpan'}</button>${onDel?'<button type="button" class="btn dng" id="d">Hapus</button>':''}<button type="button" class="btn ghost" id="c">Batal</button></div></form>`;
 document.body.append(el);const fm=el.querySelector('form'),close=()=>el.remove();
 el.querySelector('#c').onclick=close;
 if(onDel)el.querySelector('#d').onclick=async()=>{if(!confirm('Hapus data ini? Tidak bisa dibatalkan.'))return;try{await onDel();close();render()}catch(e){}};
 fm.onsubmit=async e=>{e.preventDefault();const v={};
  for(const f of fields){const x=fm.elements[f.k];
   if(f.t==='check')v[f.k]=x.checked;
   else if(f.t==='number')v[f.k]=x.value===''?(f.z?0:null):parseFloat(x.value);
   else{const s=x.value.trim();v[f.k]=s===''?null:s}}
  try{await onSave(v);close();render()}catch(e){}}}

/* ---------- setup & login ---------- */
function setup(){$('#nav').style.display='none';const c=JSON.parse(localStorage.getItem(CFG)||'{}');
 $('#main').innerHTML=`<h1>Setup Supabase</h1><p class="mut">Isi sekali saja. Pakai <b>Project URL</b> dan <b>anon/publishable key</b>. Jangan pernah pakai service_role key.</p><form class="card" id="f"><label>Project URL<input id="u" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co" required></label><label>Anon / publishable key<input id="k" value="${esc(c.key||'')}" required></label><button class="btn">Simpan</button></form>`;
 $('#f').onsubmit=e=>{e.preventDefault();localStorage.setItem(CFG,JSON.stringify({url:$('#u').value.trim().replace(/\/$/,''),key:$('#k').value.trim()}));boot()}}
function login(){$('#nav').style.display='none';
 $('#main').innerHTML=`<h1>Customstuff Recap</h1><form class="card" id="f"><label>Email<input id="e" type="email" autocomplete="username" required></label><label>Password<input id="p" type="password" autocomplete="current-password" required></label><button class="btn">Masuk</button></form><p class="mut"><a href="#" onclick="A.reset();return false">Ubah setup Supabase</a></p>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});if(error)toast('Gagal masuk: '+error.message)}}
A.reset=()=>{localStorage.removeItem(CFG);sb=null;setup()};

/* ---------- navigation ---------- */
const NAV=[['home','🏠','Beranda'],['po','📦','PO'],['exp','🧾','Biaya'],['rep','📊','Laporan'],['more','⚙️','Lainnya']];
const go=(p,x={})=>{Object.assign(S,{page:p},x);render();scrollTo(0,0)};
async function render(){
 if(!sb)return setup();if(!session)return login();
 const base=['poDetail','order'].includes(S.page)?'po':S.page;
 $('#nav').style.display='flex';
 $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===base?'on':''}" onclick="go('${n[0]}',{${n[0]==='po'?'po:null,folder:null':''}})">${n[1]}<br>${n[2]}</button>`).join('');
 $('#main').innerHTML='<p class="mut">Memuat…</p>';
 try{await loadF();$('#main').innerHTML=await PAGES[S.page]()}catch(e){$('#main').innerHTML=`<p class="err">Gagal memuat: ${esc(e.message)}</p>`}}

/* ---------- beranda ---------- */
PAGES.home=async()=>{
 const[fin,un,os]=await Promise.all([q(sb.from('v_po_finance').select('*')),q(sb.from('v_unallocated_expenses').select('total')),q(sb.from('v_order_summary').select('remaining,payment_status'))]);
 const lb=+localStorage.getItem('cs_lastbackup')||0,d=lb?Math.floor((Date.now()-lb)/864e5):null;
 const owed=os.filter(o=>o.payment_status!=='lunas'),laba=sum(fin,'laba_bersih');
 return`<h1>Beranda</h1>
 ${d===null||d>=7?`<div class="card" style="background:var(--soft)">⚠️ ${d===null?'Belum pernah backup.':'Terakhir backup '+d+' hari lalu.'} <a href="#" onclick="go('more');return false">Backup sekarang</a></div>`:''}
 <div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="A.quickOrder()">+ Order</button><button class="btn sm" onclick="A.expForm()">+ Pengeluaran</button><button class="btn sm" onclick="go('po');setTimeout(A.poForm,50)">+ PO</button></div>
 <div class="grid"><div class="met">Omzet<b>${rp(sum(fin,'omzet'))}</b></div><div class="met">Total biaya<b>${rp(sum(fin,'total_biaya'))}</b></div>
 <div class="met">Laba bersih<b class="${laba<0?'neg':'pos'}">${rp(laba)}</b></div><div class="met">Jumlah PO<b>${fin.length}</b></div>
 <div class="met">Belum lunas<b>${owed.length} order</b><span class="mut">${rp(sum(owed,'remaining'))}</span></div>
 <div class="met tap" onclick="go('exp',{onlyUn:true})">Belum dialokasikan<b>${rp(sum(un,'total'))}</b><span class="mut">${un.length} pengeluaran</span></div></div>
 <p class="mut">Omzet = total order. Laba = omzet dikurangi modal & biaya PO. Uang masuk dicatat terpisah di tiap order.</p>`};
A.quickOrder=async()=>{const p=await q(sb.from('pos').select('id,name').eq('archived',false).order('po_date',{ascending:false}));
 if(!p.length)return toast('Buat PO dulu');
 sheet('Order untuk PO mana?',[{k:'po',l:'PO',t:'select',o:p.map(x=>[x.id,x.name])}],async v=>{S.po=v.po;S.page='poDetail';S.tab='order';setTimeout(()=>A.orderForm(v.po),80)},null,'Lanjut')};

/* ---------- PO & folder ---------- */
PAGES.po=async()=>{
 const[pos,fin]=await Promise.all([q(sb.from('pos').select('*').order('po_date',{ascending:false})),q(sb.from('v_po_finance').select('*'))]);
 const cur=S.folder,subs=F.filter(f=>(f.parent_id||null)===cur),list=pos.filter(p=>(p.folder_id||null)===cur);
 const fm=Object.fromEntries(fin.map(x=>[x.po_id,x]));
 const crumbs=cur?`<a href="#" onclick="go('po',{folder:null});return false">Semua</a> / `+fpath(cur).split(' / ').map((n,i,a)=>{let id=cur;for(let j=a.length-1;j>i;j--)id=F.find(f=>f.id===id).parent_id;return`<a href="#" onclick="go('po',{folder:'${id}'});return false">${esc(n)}</a>`}).join(' / '):'Semua';
 return`<h1>PO & Folder</h1><p class="mut">${crumbs}</p>
 <div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="A.folderForm()">+ Folder</button><button class="btn sm" onclick="A.poForm()">+ PO</button>${cur?`<button class="btn sm ghost" onclick="A.folderForm('${cur}')">✎ Folder ini</button>`:''}</div>
 ${subs.map(f=>`<div class="card tap row sp" onclick="go('po',{folder:'${f.id}'})"><span>📁 ${esc(f.name)}</span><span class="mut">${pos.filter(p=>desc(f.id).includes(p.folder_id)).length} PO ›</span></div>`).join('')}
 ${list.map(p=>{const x=fm[p.id]||{};return`<div class="card tap" onclick="go('poDetail',{po:'${p.id}',tab:'ringkasan'})"><div class="row sp"><b>${esc(p.name)}</b><span class="mut">${p.po_date}</span></div><div class="mut">${x.order_count||0} order · omzet ${rp(x.omzet)} · laba <span class="${x.laba_bersih<0?'neg':'pos'}">${rp(x.laba_bersih)}</span></div></div>`}).join('')}
 ${!subs.length&&!list.length?'<p class="mut">Folder ini masih kosong.</p>':''}`};
A.folderForm=async id=>{const f=id?F.find(x=>x.id===id):null;
 sheet(f?'Ubah folder':'Folder baru',[{k:'name',l:'Nama folder',v:f?.name,req:1}],
  async v=>{if(f){await upd('folders',f.id,v)}else{const r=await ins('folders',{name:v.name,parent_id:S.folder});log('buat','folder',r.id,v.name)}},
  f?async()=>{await del('folders',f.id);S.folder=f.parent_id}:null)};
const poFields=p=>[{k:'name',l:'Nama PO',v:p?.name,req:1},{k:'po_date',l:'Tanggal PO',t:'date',v:p?.po_date||today(),req:1},{k:'close_date',l:'Tanggal tutup PO',t:'date',v:p?.close_date},{k:'target_qty',l:'Target jumlah',t:'number',v:p?.target_qty},{k:'folder_id',l:'Folder',t:'select',o:fopts(),v:p?.folder_id??S.folder??''},{k:'notes',l:'Catatan',t:'area',v:p?.notes}];
A.poForm=async()=>sheet('PO baru',poFields(),async v=>{const r=await ins('pos',v);log('buat','po',r.id,v.name);S.po=r.id;S.page='poDetail';S.tab='ringkasan'});
A.poEdit=async()=>{const p=await q(sb.from('pos').select('*').eq('id',S.po).single());
 sheet('Ubah PO',poFields(p),v=>upd('pos',p.id,v),async()=>{await del('pos',p.id);log('hapus','po',p.id,p.name);S.page='po'})};
A.setStatus=async(k,v)=>{await upd('pos',S.po,{[k]:v});toast('Status disimpan')};

PAGES.poDetail=async()=>{
 const id=S.po,[p,fin,prods,ords,exps]=await Promise.all([q(sb.from('pos').select('*').eq('id',id).single()),q(sb.from('v_po_finance').select('*').eq('po_id',id).single()),
  q(sb.from('products').select('*').eq('po_id',id).order('created_at')),q(sb.from('v_order_summary').select('*').eq('po_id',id).order('order_date',{ascending:false})),
  q(sb.from('expenses').select('*').eq('po_id',id).order('spent_at',{ascending:false}))]);
 const st=(k,l)=>`<label>${l}<select onchange="A.setStatus('${k}',this.value)">${['belum','berjalan','selesai'].map(o=>`<option${p[k]===o?' selected':''}>${o}</option>`).join('')}</select></label>`;
 const tabs=[['ringkasan','Ringkasan'],['produk','Produk'],['order','Order'],['biaya','Biaya']];
 let body='';
 if(S.tab==='ringkasan')body=`<div class="grid">${[['Omzet',fin.omzet],['Modal produksi',fin.modal_produksi],['Packing',fin.biaya_packing],['Freebies',fin.biaya_freebies],['Biaya lain',fin.biaya_lain],['Total biaya',fin.total_biaya]].map(m=>`<div class="met">${m[0]}<b>${rp(m[1])}</b></div>`).join('')}</div><div class="met" style="margin-top:8px">Laba bersih<b class="${fin.laba_bersih<0?'neg':'pos'}">${rp(fin.laba_bersih)}</b><span class="mut">${fin.order_count} order · ${fin.qty_sold} pcs${p.target_qty?' / target '+p.target_qty:''}</span></div>
  <h2>Status PO</h2><div class="grid">${st('status_production','Produksi')}${st('status_packing','Packing')}${st('status_shipping','Pengiriman')}</div>${p.notes?`<p class="mut">${esc(p.notes)}</p>`:''}`;
 if(S.tab==='produk')body=`<button class="btn sm" onclick="A.prodForm()">+ Produk</button>`+prods.map(x=>`<div class="item tap" onclick="A.prodForm('${x.id}')"><span>${esc(x.name)}</span><span class="mut">jual ${rp(x.sell_price)} · modal ${rp(x.cost_price)}</span></div>`).join('')+(prods.length?'':'<p class="mut">Belum ada produk.</p>');
 if(S.tab==='order')body=`<button class="btn sm" onclick="A.orderForm()">+ Order</button>`+ords.map(o=>`<div class="item tap" onclick="go('order',{order:'${o.order_id}'})"><span><b>${esc(o.order_no)}</b> ${esc(o.buyer)}<br>${chip(o.payment_status)}</span><span style="text-align:right">${rp(o.total)}<br><span class="mut">sisa ${rp(o.remaining)}</span></span></div>`).join('')+(ords.length?'':'<p class="mut">Belum ada order.</p>');
 if(S.tab==='biaya')body=`<button class="btn sm" onclick="A.expForm(null,'${id}')">+ Biaya</button>`+exps.map(expRow).join('')+(exps.length?'':'<p class="mut">Belum ada biaya yang ditautkan.</p>');
 return`<p class="mut"><a href="#" onclick="go('po',{folder:${p.folder_id?`'${p.folder_id}'`:'null'}});return false">‹ Kembali</a></p><div class="row sp"><h1>${esc(p.name)}</h1><button class="btn sm ghost" onclick="A.poEdit()">✎</button></div>
 <div class="tabs">${tabs.map(t=>`<button class="btn sm ${S.tab===t[0]?'':'ghost'}" onclick="go('poDetail',{tab:'${t[0]}'})">${t[1]}</button>`).join('')}</div>${body}`};
A.prodForm=async id=>{const x=id?await q(sb.from('products').select('*').eq('id',id).single()):null;
 sheet(x?'Ubah produk':'Produk baru',[{k:'name',l:'Nama produk',v:x?.name,req:1},{k:'sell_price',l:'Harga jual',t:'number',v:x?.sell_price,z:1},{k:'cost_price',l:'Harga modal per unit',t:'number',v:x?.cost_price,z:1},{k:'notes',l:'Catatan',t:'area',v:x?.notes}],
  v=>x?upd('products',id,v):ins('products',{...v,po_id:S.po}),x?()=>del('products',id):null)};

/* ---------- order ---------- */
A.orderForm=async(poId)=>{const po=poId||S.po;S.po=po;
 const r=await sb.from('orders').select('id',{count:'exact',head:true}).eq('po_id',po);
 sheet('Order baru',[{k:'order_no',l:'No. order',v:'#'+((r.count||0)+1),req:1},{k:'buyer',l:'Nama buyer',req:1},{k:'order_date',l:'Tanggal',t:'date',v:today(),req:1},{k:'notes',l:'Catatan',t:'area'}],
  async v=>{const o=await ins('orders',{...v,po_id:po});log('buat','order',o.id,v.order_no+' '+v.buyer);S.page='order';S.order=o.id})};
PAGES.order=async()=>{
 const id=S.order,[o,sm,items,pays]=await Promise.all([q(sb.from('orders').select('*').eq('id',id).single()),q(sb.from('v_order_summary').select('*').eq('order_id',id).single()),
  q(sb.from('order_items').select('*').eq('order_id',id).order('created_at')),q(sb.from('payments').select('*').eq('order_id',id).order('paid_at'))]);
 return`<p class="mut"><a href="#" onclick="go('poDetail',{po:'${o.po_id}',tab:'order'});return false">‹ Kembali ke PO</a></p>
 <div class="row sp"><h1>${esc(o.order_no)} · ${esc(o.buyer)}</h1><button class="btn sm ghost" onclick="A.orderEdit()">✎</button></div>
 <div class="grid"><div class="met">Total<b>${rp(sm.total)}</b></div><div class="met">Terbayar<b>${rp(sm.paid)}</b>${chip(sm.payment_status)}</div></div>
 <h2>Item</h2><button class="btn sm" onclick="A.itemForm('${o.po_id}')">+ Item</button>
 ${items.map(i=>`<div class="item tap" onclick="A.itemEdit('${i.id}')"><span>${esc(i.product_name)} ×${i.qty}</span><span>${rp(i.qty*i.sell_price)}</span></div>`).join('')||'<p class="mut">Belum ada item.</p>'}
 <h2>Pembayaran</h2><button class="btn sm" onclick="A.payForm(${Math.max(0,sm.remaining)})">+ Pembayaran</button>
 ${pays.map(p=>`<div class="item tap" onclick="A.payEdit('${p.id}')"><span>${p.paid_at}<br><span class="mut">${esc(p.kind==='buyer'?(p.method||'Buyer'):'Packing Shopee')}</span></span><span>${rp(p.amount)}</span></div>`).join('')||'<p class="mut">Belum ada pembayaran.</p>'}
 ${o.notes?`<p class="mut">${esc(o.notes)}</p>`:''}`};
A.orderEdit=async()=>{const o=await q(sb.from('orders').select('*').eq('id',S.order).single());
 sheet('Ubah order',[{k:'order_no',l:'No. order',v:o.order_no,req:1},{k:'buyer',l:'Nama buyer',v:o.buyer,req:1},{k:'order_date',l:'Tanggal',t:'date',v:o.order_date,req:1},{k:'notes',l:'Catatan',t:'area',v:o.notes}],
  v=>upd('orders',o.id,v),async()=>{await del('orders',o.id);log('hapus','order',o.id,o.order_no);S.page='poDetail';S.tab='order';S.po=o.po_id})};
A.A.itemForm=async po=>{const pr=await q(sb.from('products').select('*').eq('po_id',po));
 if(!pr.length)return toast('Tambahkan produk dulu di tab Produk');
 sheet('Tambah item',[{k:'pid',l:'Produk',t:'select',o:pr.map(p=>[p.id,`${p.name} (${rp(p.sell_price)})`])},{k:'qty',l:'Jumlah',t:'number',v:1,req:1},{k:'price',l:'Harga jual (kosongkan = harga produk)',t:'number'}],
  v=>{const p=pr.find(x=>x.id===v.pid);return ins('order_items',{order_id:S.order,product_id:p.id,product_name:p.name,qty:v.qty,sell_price:v.price??p.sell_price,cost_price:p.cost_price})})};
A.itemEdit=async id=>{const i=await q(sb.from('order_items').select('*').eq('id',id).single());
 sheet('Ubah item: '+i.product_name,[{k:'qty',l:'Jumlah',t:'number',v:i.qty,req:1},{k:'sell_price',l:'Harga jual',t:'number',v:i.sell_price,z:1}],v=>upd('order_items',id,v),()=>del('order_items',id))};
const payFields=p=>[{k:'amount',l:'Jumlah',t:'number',v:p?.amount,req:1},{k:'paid_at',l:'Tanggal',t:'date',v:p?.paid_at||today(),req:1},{k:'kind',l:'Jenis',t:'select',o:[['buyer','Pembayaran buyer'],['packing_shopee','Packing/resi Shopee Split Bill']],v:p?.kind||'buyer'},{k:'method',l:'Metode (transfer, tunai, dll)',v:p?.method},{k:'notes',l:'Catatan',t:'area',v:p?.notes}];
A.payForm=rem=>{const f=payFields();f[0].v=rem||'';sheet('Catat pembayaran',f,v=>ins('payments',{...v,order_id:S.order,matched:true}))};
A.payEdit=async id=>{const p=await q(sb.from('payments').select('*').eq('id',id).single());sheet('Ubah pembayaran',payFields(p),v=>upd('payments',id,v),()=>del('payments',id))};

/* ---------- pengeluaran ---------- */
const CT=[['produksi','Produksi'],['packing','Packing'],['freebies','Freebies'],['sample','Sample'],['ongkir','Ongkir'],['lain','Lain-lain']];
const expRow=e=>`<div class="item tap" onclick="A.expForm('${e.id}')"><span>${esc(e.item_name)} ×${e.qty}<br><span class="mut">${e.spent_at} · ${e.cost_type}${e.vendor_name?' · '+esc(e.vendor_name):''}${e.is_stock_purchase?' · stok':''}</span></span><span>${rp(e.total)}</span></div>`;
PAGES.exp=async()=>{
 let qy=sb.from('expenses').select('*').order('spent_at',{ascending:false}).limit(200);if(S.onlyUn)qy=qy.is('po_id',null).eq('is_stock_purchase',false);
 const ex=await q(qy);
 return`<h1>Pengeluaran</h1><div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="A.expForm()">+ Pengeluaran</button><button class="btn sm ghost" onclick="go('exp',{onlyUn:${!S.onlyUn}})">${S.onlyUn?'✓ Belum dialokasikan':'Filter: belum dialokasikan'}</button></div>
 <p class="mut">Total tampil: ${rp(sum(ex,'total'))}. Ketuk baris untuk ubah atau tautkan ke PO.</p>${ex.map(expRow).join('')||'<p class="mut">Belum ada data.</p>'}`};
A.expForm=async(id,poId)=>{const[e,pos]=await Promise.all([id?q(sb.from('expenses').select('*').eq('id',id).single()):null,q(sb.from('pos').select('id,name').order('po_date',{ascending:false}))]);
 sheet(e?'Ubah pengeluaran':'Pengeluaran baru',[{k:'spent_at',l:'Tanggal',t:'date',v:e?.spent_at||today(),req:1},{k:'item_name',l:'Nama barang/biaya',v:e?.item_name,req:1},{k:'qty',l:'Jumlah',t:'number',v:e?.qty??1,req:1},{k:'unit_price',l:'Harga satuan',t:'number',v:e?.unit_price,z:1},
  {k:'cost_type',l:'Jenis biaya',t:'select',o:CT,v:e?.cost_type||'lain'},{k:'po_id',l:'Tautkan ke PO',t:'select',o:[['','(Belum dialokasikan)'],...pos.map(p=>[p.id,p.name])],v:e?.po_id??poId??''},
  {k:'vendor_name',l:'Vendor / toko',v:e?.vendor_name},{k:'payment_method',l:'Metode bayar',v:e?.payment_method},{k:'is_stock_purchase',l:'Ini pembelian stok (jadi beban saat stok dipakai)',t:'check',v:e?.is_stock_purchase},{k:'notes',l:'Catatan',t:'area',v:e?.notes}],
  async v=>{v.category=v.cost_type;if(e){await upd('expenses',id,v)}else{const r=await ins('expenses',v);log('buat','pengeluaran',r.id,v.item_name);
   await sb.from('price_history').insert({item_name:v.item_name,unit_price:v.unit_price,vendor_name:v.vendor_name,recorded_at:v.spent_at,expense_id:r.id})}},
  e?async()=>{await del('expenses',id);log('hapus','pengeluaran',id,e.item_name)}:null)};

/* ---------- laporan ---------- */
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
PAGES.rep=async()=>{
 let fin=await q(sb.from('v_po_finance').select('*').order('po_date',{ascending:false}));
 fin=fin.filter(x=>(!S.from||x.po_date>=S.from)&&(!S.to||x.po_date<=S.to));S.rows=fin;
 const lines=a=>`<div class="grid"><div class="met">Omzet<b>${rp(sum(a,'omzet'))}</b></div><div class="met">Biaya<b>${rp(sum(a,'total_biaya'))}</b></div></div><div class="met" style="margin-top:8px">Laba<b class="${sum(a,'laba_bersih')<0?'neg':'pos'}">${rp(sum(a,'laba_bersih'))}</b></div>`;
 return`<h1>Laporan</h1><div class="grid"><label>Dari<input type="date" value="${S.from}" onchange="S.from=this.value;render()"></label><label>Sampai<input type="date" value="${S.to}" onchange="S.to=this.value;render()"></label></div>
 ${lines(fin)}<button class="btn sm ghost" style="margin-top:8px" onclick="A.csv()">⬇ Ekspor CSV</button>
 <h2>Per folder</h2>${F.map(f=>{const a=fin.filter(x=>desc(f.id).includes(x.folder_id));return`<div class="item"><span>📁 ${esc(fpath(f.id))}<br><span class="mut">${a.length} PO · omzet ${rp(sum(a,'omzet'))}</span></span><b class="${sum(a,'laba_bersih')<0?'neg':'pos'}">${rp(sum(a,'laba_bersih'))}</b></div>`}).join('')||'<p class="mut">Belum ada folder.</p>'}
 <h2>Per PO</h2>${fin.map(x=>`<div class="item tap" onclick="go('poDetail',{po:'${x.po_id}',tab:'ringkasan'})"><span>${esc(x.name)}<br><span class="mut">${x.po_date} · omzet ${rp(x.omzet)}</span></span><b class="${x.laba_bersih<0?'neg':'pos'}">${rp(x.laba_bersih)}</b></div>`).join('')||'<p class="mut">Tidak ada PO pada rentang ini.</p>'}`};
A.csv=()=>{const h=['PO','Tanggal','Order','Qty','Omzet','Modal produksi','Packing','Freebies','Biaya lain','Total biaya','Laba'];
 const r=S.rows.map(x=>[x.name,x.po_date,x.order_count,x.qty_sold,x.omzet,x.modal_produksi,x.biaya_packing,x.biaya_freebies,x.biaya_lain,x.total_biaya,x.laba_bersih]);
 dl('laporan-customstuff.csv',[h,...r].map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};

/* ---------- lainnya: backup, aktivitas, akun ---------- */
const TABLES=['folders','vendors','vendor_offers','samples','pos','products','orders','order_items','payments','expenses','price_history','wishlist','templates','template_items','po_cost_lines','stock_items','stock_movements','quick_actions','todos','activity_log','settings'];
PAGES.more=async()=>{
 const lg=await q(sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(25));const lb=+localStorage.getItem('cs_lastbackup')||0;
 return`<h1>Lainnya</h1><div class="card"><b>Backup data</b><p class="mut">Terakhir: ${lb?new Date(lb).toLocaleString('id-ID'):'belum pernah'}. Unduh rutin sebagai cadangan.</p><button class="btn" onclick="A.backup()">⬇ Unduh backup JSON</button></div>
 <div class="card"><b>Akun</b><p class="mut">${esc(session.user.email)}</p><button class="btn ghost" onclick="sb.auth.signOut()">Keluar</button></div>
 <h2>Aktivitas terakhir</h2>${lg.map(l=>`<div class="item"><span>${esc(l.action)} ${esc(l.entity)}: ${esc(l.summary)}</span><span class="mut">${new Date(l.created_at).toLocaleDateString('id-ID')}</span></div>`).join('')||'<p class="mut">Belum ada.</p>'}
 <p class="mut">Segera hadir: stok, template, vendor, rekonsiliasi, pengingat, tombol cepat, restore backup.</p>`};
A.backup=async()=>{toast('Menyiapkan backup…');const out={app:'customstuff',version:1,exported_at:new Date().toISOString(),tables:{}};
 for(const t of TABLES){let all=[],i=0;for(;;){const d=await q(sb.from(t).select('*').range(i,i+999));all=all.concat(d);if(d.length<1000)break;i+=1000}out.tables[t]=all}
 dl('backup-customstuff-'+today()+'.json',JSON.stringify(out),'application/json');localStorage.setItem('cs_lastbackup',Date.now());toast('Backup selesai');render()};

/* ---------- boot ---------- */
async function boot(){
 const c=JSON.parse(localStorage.getItem(CFG)||'null');if(!c||!window.supabase){sb=null;return render()}
 sb=supabase.createClient(c.url,c.key);
 const{data}=await sb.auth.getSession();session=data.session;
 sb.auth.onAuthStateChange((_e,s)=>{const was=!!session;session=s;if(was!==!!s)render()});
 render()}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
